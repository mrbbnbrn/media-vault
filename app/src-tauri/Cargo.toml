[package]
name = "media-vault-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "MediaVault"

[[bin]]
name = "MediaVault"
path = "src/main.rs"

[lib]
name = "media_vault_app"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4.3"
rusqlite = "=0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "=0.24.0", features = ["aes256"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
vault-core = { version = "0.1.0", path = "../../crates/vault-core" }
zeroize = "1.9.1"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_StationsAndDesktops", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Beat detection: listens to the computer's own sound (WASAPI loopback).
cpal = "=0.18.2"

[dev-dependencies]
tempfile = "3.27.0"
