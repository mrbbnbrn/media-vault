[package]
name = "media-vault-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "MediaVault"

[[bin]]
name = "MediaVault"
path = "src/main.rs"

[lib]
name = "media_vault_app"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hex = "0.4.3"
# Clipboard pictures -> PNG (winshell). Same version Tauri already uses.
png = "0.18.1"
rusqlite = "=0.40.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "=0.24.0", features = ["aes256"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
# "Import finished" toasts when a long job ends while the window is in the background.
tauri-plugin-notification = "=2.5.0"
vault-core = { version = "0.1.0", path = "../../crates/vault-core" }
zeroize = "1.9.1"
# The offline AI upscaler (upscale.rs). ONNX Runtime is loaded at run time
# from the optional upscaler pack (tools/upscaler), so the app starts fine
# without it. API 24 = ONNX Runtime 1.24, the last one with DirectML.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
# Saving an upscaled photo as a high-quality JPEG.
jpeg-encoder = "0.7.1"
# Reading thumbnails for their colour sketch (sketch.rs); the tests also use it
# to build and decode sample pictures.
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_StationsAndDesktops", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Drag out / copy to Explorer and reading the clipboard (winshell), and
# listening to the computer's own sound for beat sync (loopback_win: WASAPI
# loopback). The same versions Tauri (tao, wry) already pull in.
windows = { version = "0.62.2", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

[dev-dependencies]
tempfile = "3.27.0"
