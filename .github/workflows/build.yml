name: build

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # A push whose last commit message contains [quick] (small fixes) skips the
  # slow Windows test run; the Linux tests and the Windows package still run.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ contains(github.event.head_commit.message, '[quick]') && fromJSON('["ubuntu-latest"]') || fromJSON('["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries for the app window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: UI — install, test, build
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - name: Rust tests
        shell: bash
        # Failing tests also go out as annotations, so they can be read without the full log.
        run: |
          set -o pipefail
          cargo test --workspace --release --locked 2>&1 | tee rust-tests.txt || {
            grep -E "panicked at|^---- |^test .* FAILED|assertion|left:|right:" rust-tests.txt | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Lint
        shell: bash
        # Lint messages also go out as annotations, so they can be read without the full log.
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings 2>&1 | tee clippy.txt || {
            grep -E "(error|warning)" clippy.txt | grep -v "^error: could not compile" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-check FORMAT.md with the independent Python decrypter
        shell: bash
        run: |
          pip install cryptography argon2-cffi mnemonic
          cargo build --release --locked -p vault-export
          cargo build --release --locked -p vault-core --example make_demo_vault
          ./target/release/examples/make_demo_vault demo "ci password" > phrase.txt
          ./target/release/vault-export export demo out-rust --recovery < phrase.txt
          python -I tools/reference_decrypt.py demo out-python --recovery < phrase.txt
          diff -r out-rust out-python
          # A vault without a password opens without asking, in both.
          ./target/release/examples/make_demo_vault open-demo --no-password > open-phrase.txt
          ./target/release/vault-export export open-demo open-rust < /dev/null
          python -I tools/reference_decrypt.py open-demo open-python < /dev/null
          diff -r open-rust open-python
          python -I tools/reference_decrypt.py open-demo open-python-rk --recovery < open-phrase.txt
          diff -r open-rust open-python-rk
          echo "Rust export tool and Python reference decrypter agree."

  # Runs at the same time as the tests. Its release is only a draft until
  # the tests have passed too (see "publish" below).
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The released app is built for x86-64-v2 (SSE4.2 and POPCNT: every
      # 64-bit Intel and AMD processor since about 2009), so the compiler may
      # use those instructions everywhere. Only here: the tests above and
      # vault-export.exe (the recovery tool, which must run on anything) keep
      # the plain x86-64 baseline. AES and carry-less multiply (encryption)
      # and F16C (smart search) are picked at run time either way.
      #
      # Profile-guided optimisation (PGO) was looked at and left out for now:
      # it needs the release build twice (an instrumented build, a profiling
      # run, then the optimised build), which adds well over 10 minutes to
      # this job, and the only representative workload that exists is the
      # self-test in the real window, which needs the models and the web
      # engine. The plan, when it is worth it: `rustup component add
      # llvm-tools`, build with RUSTFLAGS="-Cprofile-generate=$PWD/pgo",
      # run a headless workload (create a demo vault, import a few hundred
      # generated pictures and a big file, read everything back, search),
      # `llvm-profdata merge -o pgo.profdata pgo`, and build again with
      # RUSTFLAGS="-Cprofile-use=$PWD/pgo.profdata -Ctarget-cpu=x86-64-v2".
      - name: Build MediaVault.exe
        working-directory: app
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v2
        run: |
          npm ci
          npx tauri build --no-bundle
      - name: Build vault-export.exe
        run: cargo build --release --locked -p vault-export

      - name: Smart-search models (from the models-v2 release of this repo, else models-v1)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p target/release/models
          if gh release view models-v2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download models-v2 --repo "$GITHUB_REPOSITORY" --dir target/release/models --pattern 'clip-*'
            # Its ONNX Runtime too (kept out of the packaged folders), so the self-test analyses natively.
            mkdir -p ortdl
            gh release download models-v2 --repo "$GITHUB_REPOSITORY" --dir ortdl --pattern onnxruntime.dll --pattern DirectML.dll
            echo "MV_ORT_DIR=$(cygpath -w "$PWD/ortdl")" >> "$GITHUB_ENV"
            ls -la ortdl
          else
            gh release download models-v1 --repo "$GITHUB_REPOSITORY" --dir target/release/models --pattern 'clip-*'
          fi
          ls -la target/release/models
      - name: Face recognition pack for the self-test (the newest faces-* release, if any)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ftag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' | grep '^faces-' | sort -r | head -1 || true)
          if [ -z "$ftag" ]; then echo "No faces pack release yet: the self-test skips face recognition."; exit 0; fi
          # Unzipped outside target/release, so it never ends up in another download.
          rm -rf facepack && mkdir facepack
          gh release download "$ftag" --repo "$GITHUB_REPOSITORY" --dir facepack --pattern MediaVault-faces-windows.zip
          (cd facepack && 7z x -y MediaVault-faces-windows.zip > /dev/null)
          ls -la facepack/MediaVault/tools/faces
          echo "MV_FACES=$(cygpath -w "$PWD/facepack/MediaVault/tools/faces")" >> "$GITHUB_ENV"
      - name: Video tool (ffmpeg, LGPL build pinned to one BtbN/FFmpeg-Builds release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # The last build of each month is kept there for two years.
          FFMPEG_RELEASE: autobuild-2026-09-30-13-08
          FFMPEG_ASSET: ffmpeg-N-*-win64-lgpl.zip
        run: |
          set -eu
          rm -rf ffdl && mkdir ffdl && cd ffdl
          gh release download "$FFMPEG_RELEASE" --repo BtbN/FFmpeg-Builds --pattern "$FFMPEG_ASSET" --pattern checksums.sha256
          zips=(ffmpeg-*.zip)
          [ "${#zips[@]}" = 1 ] || { echo "Expected one ffmpeg zip, found ${#zips[@]}: ${zips[*]}"; exit 1; }
          zip="${zips[0]}"
          awk -v f="$zip" '$2 == f || $2 == "*" f { print $1 "  " f }' checksums.sha256 > want.sha256
          [ -s want.sha256 ] || { echo "No checksum listed for $zip"; exit 1; }
          sha256sum -c want.sha256
          7z x -y "$zip" > /dev/null
          mkdir -p ../target/release/tools
          cp "${zip%.zip}/bin/ffmpeg.exe" ../target/release/tools/ffmpeg.exe
          cp "${zip%.zip}/LICENSE.txt" ../target/release/tools/ffmpeg-LICENSE.txt
          printf '%s\n' "ffmpeg ($zip) from https://github.com/BtbN/FFmpeg-Builds/releases/tag/$FFMPEG_RELEASE" \
            "LGPL build. Its source code: https://github.com/FFmpeg/FFmpeg (version in the file name above)." \
            "Media Vault uses it to convert items and make animations." > ../target/release/tools/ffmpeg-README.txt
          echo "$FFMPEG_RELEASE/$zip" > ../target/release/tools/VERSION.txt
          ../target/release/tools/ffmpeg.exe -hide_banner -version | head -1
          ../target/release/tools/ffmpeg.exe -hide_banner -encoders | grep -E " (libx264|libopenh264|h264_mf|libvpx-vp9|libopus|libwebp|aac) " || true
      - name: Built-in web engine (a copy of this runner's WebView2)
        shell: pwsh
        run: |
          $base = "C:\Program Files (x86)\Microsoft\EdgeWebView\Application"
          $v = Get-ChildItem $base -Directory | Where-Object { $_.Name -match '^\d+\.' } | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $v) { Write-Error "No WebView2 runtime on this runner"; exit 1 }
          Copy-Item $v.FullName "target\release\WebView2" -Recurse
          Set-Content "target\release\WebView2\VERSION.txt" $v.Name
          "Copied WebView2 $($v.Name): $([math]::Round((Get-ChildItem target\release\WebView2 -Recurse | Measure-Object Length -Sum).Sum / 1MB)) MB"
      - name: Test pictures for faces and smart search
        shell: bash
        run: |
          mkdir -p extra
          curl -fsSL -o extra/sample1.jpg https://raw.githubusercontent.com/vladmandic/face-api/master/demo/sample1.jpg
          for f in baboon fruits building; do curl -fsSL -o extra/$f.jpg https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/$f.jpg; done
          ls -la extra

      - name: Self-test — media, safety tools, faces, smart search and the built-in engine, in the real Windows app
        shell: pwsh
        run: |
          $env:MV_SELFTEST = "1"
          $env:MV_SELFTEST_ENGINE = "1"
          $env:MV_SELFTEST_EXTRA = "$PWD\extra"
          $env:MV_SELFTEST_OUT = "$PWD\selftest.txt"
          $p = Start-Process -FilePath "target\release\MediaVault.exe" -PassThru
          if (-not $p.WaitForExit(600000)) { $p.Kill(); Write-Error "The self-test did not finish in time"; exit 1 }
          if (Test-Path selftest.txt) {
            Get-Content selftest.txt
            $report = (Get-Content selftest.txt) -join '%0A'
            Write-Output "::notice title=Windows self-test::$report"
          } else { Write-Output "no report written" }
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed (exit $($p.ExitCode))"; exit 1 }

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/MediaVault
          cp target/release/MediaVault.exe target/release/vault-export.exe dist/MediaVault/
          cp crates/vault-core/FORMAT.md tools/reference_decrypt.py packaging/README.txt dist/MediaVault/
      - name: Publish a release (app, plus engine and models only when they are new)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd dist
          # The parts unzip into the same MediaVault folder.
          7z a -tzip -mx=9 MediaVault-app-windows.zip MediaVault > /dev/null
          ver=$(cat ../target/release/WebView2/VERSION.txt | tr -d '\r\n ')
          etag="engine-$ver"
          if ! gh release view "$etag" >/dev/null 2>&1; then
            mkdir -p e/MediaVault && cp -r ../target/release/WebView2 e/MediaVault/
            (cd e && 7z a -tzip -mx=5 ../MediaVault-engine-windows.zip MediaVault > /dev/null)
            gh release create "$etag" MediaVault-engine-windows.zip --prerelease --title "Web engine $ver (download once)" \
              --notes "The built-in web engine (Microsoft WebView2 $ver). Unzip into the same place as the app; it adds a WebView2 folder inside MediaVault."
          fi
          # The video tool (ffmpeg) is big and rarely changes: its own download, made once per pinned version.
          ttag="videotool-$(cut -d/ -f1 ../target/release/tools/VERSION.txt | sed 's/^autobuild-//')"
          if ! gh release view "$ttag" >/dev/null 2>&1; then
            mkdir -p t/MediaVault && cp -r ../target/release/tools t/MediaVault/
            (cd t && 7z a -tzip -mx=9 ../MediaVault-videotool-windows.zip MediaVault > /dev/null)
            gh release create "$ttag" MediaVault-videotool-windows.zip --prerelease --title "Video tool $ttag (download once)" \
              --notes "The video tool (ffmpeg, LGPL build) for converting and making animations. Unzip into the same place as the app; it adds a tools folder inside MediaVault."
          fi
          repo="https://github.com/$GITHUB_REPOSITORY/releases"
          tag="build-${GITHUB_RUN_NUMBER}"
          # The AI upscaler pack is made by its own workflow (upscaler.yml); point to the newest one.
          utag=$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep '^upscaler-' | sort -r | head -1 || true)
          # The face recognition pack likewise (facepack.yml).
          ftag=$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep '^faces-' | sort -r | head -1 || true)
          # The models with the native engine (modelspack.yml) once that release exists.
          mtag=models-v1
          v2note=""
          if gh release view models-v2 >/dev/null 2>&1; then
            mtag=models-v2
            v2note="  (have the models from models-v1? download this once more: it adds the engine that analyses pictures on the graphics card)"
          fi
          # And the 3D photos (depth) pack (depthpack.yml).
          dtag=$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep '^depth-' | sort -r | head -1 || true)
          printf '%s\n' \
            "**Updating:** download only MediaVault-app-windows.zip (small), close the app, and unzip it over your MediaVault folder." \
            "" \
            "**First time:** also download, once, and unzip into the same place:" \
            "- the web engine: $repo/tag/$etag (MediaVault-engine-windows.zip)" \
            "- the smart-search models: $repo/tag/$mtag (MediaVault-models-windows.zip)" \
            ${v2note:+"$v2note"} \
            "  (already have the models from before? just add MediaVault-models-english-addon.zip from the same page)" \
            "- the video tool, for converting and animations: $repo/tag/$ttag (MediaVault-videotool-windows.zip)" \
            ${utag:+"- the AI upscaler for pictures (optional, large): $repo/tag/$utag (MediaVault-upscaler-windows.zip)"} \
            ${ftag:+"- face recognition for People (optional, personal use): $repo/tag/$ftag (MediaVault-faces-windows.zip)"} \
            ${dtag:+"- 3D photos, gentle depth motion in slideshows (optional): $repo/tag/$dtag (MediaVault-depth-windows.zip)"} \
            "" \
            "Without them the app still works: it then uses the web engine that comes with Windows, smart search is off, and converting isn't available." > notes.md
          gh release create "$tag" MediaVault-app-windows.zip --target "$GITHUB_SHA" --title "Media Vault (build ${GITHUB_RUN_NUMBER})" --draft --notes-file notes.md

  # Publish the draft release only when the tests passed as well; otherwise remove it.
  publish:
    needs: [test, windows-release]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.windows-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publish or discard the release
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS: ${{ needs.test.result }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          if [ "$TESTS" = "success" ]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            echo "Published $tag"
          else
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            echo "Tests did not pass: $tag discarded"
            exit 1
          fi
