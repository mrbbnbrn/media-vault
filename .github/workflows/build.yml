name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Linux libraries for the app window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: UI — install, test, build
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - name: Rust tests
        run: cargo test --workspace --release --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cross-check FORMAT.md with the independent Python decrypter
        shell: bash
        run: |
          pip install cryptography argon2-cffi mnemonic
          cargo build --release --locked -p vault-export
          cargo build --release --locked -p vault-core --example make_demo_vault
          ./target/release/examples/make_demo_vault demo "ci password" > phrase.txt
          ./target/release/vault-export export demo out-rust --recovery < phrase.txt
          python -I tools/reference_decrypt.py demo out-python --recovery < phrase.txt
          diff -r out-rust out-python
          echo "Rust export tool and Python reference decrypter agree."

  windows-release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build MediaVault.exe
        working-directory: app
        run: |
          npm ci
          npx tauri build --no-bundle
      - name: Self-test — pictures, GIFs and video play from the vault in the real Windows web engine
        shell: pwsh
        run: |
          $env:MV_SELFTEST = "1"
          $env:MV_SELFTEST_OUT = "$PWD\selftest.txt"
          $p = Start-Process -FilePath "target\release\MediaVault.exe" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Error "The self-test did not finish in time"; exit 1 }
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Output "no report written" }
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed (exit $($p.ExitCode))"; exit 1 }
      - name: Build vault-export.exe
        run: cargo build --release --locked -p vault-export
      - name: Package portable folder
        shell: bash
        run: |
          mkdir -p dist/MediaVault
          cp target/release/MediaVault.exe dist/MediaVault/
          cp target/release/vault-export.exe dist/MediaVault/
          cp crates/vault-core/FORMAT.md dist/MediaVault/
          cp tools/reference_decrypt.py dist/MediaVault/
          cp packaging/README.txt dist/MediaVault/
      - uses: actions/upload-artifact@v4
        with:
          name: MediaVault-windows
          path: dist/MediaVault
