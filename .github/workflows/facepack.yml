name: faces pack

# Builds the optional face recognition download, MediaVault-faces-windows.zip,
# and publishes it once under its own tag (like the upscaler pack). Run by hand
# (Actions → faces pack → Run workflow); it never runs on a push. Runs on
# Linux: nothing in it needs Windows, and nothing is converted (the models are
# already ONNX).
#
# The zip unzips next to the app and adds MediaVault\tools\faces\:
#   det_10g.onnx, w600k_r50.onnx   InsightFace buffalo_l (SCRFD-10G face finder, ArcFace R50),
#                                  from the official InsightFace release, checked
#   onnxruntime.dll, DirectML.dll  official NuGet packages, checked against nuget.org
#                                  (the same versions as the upscaler pack, so either can serve both)
#   LICENSES.txt, README.txt, SHA256SUMS.txt, VERSION.txt
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (default faces-<today>)
        required: false

permissions:
  contents: write

env:
  # Keep in step with upscaler.yml (the app's ort crate asks for API 24).
  ORT_DML_VERSION: 1.24.4
  DIRECTML_VERSION: 1.15.4
  BUFFALO_URL: https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
  BUFFALO_SHA256: 80ffe37d8a5940d59a7384c201a2a38d4741f2f3c51eef46ebb28218a7b0ca2f
  DET_SHA256: 5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91
  REC_SHA256: 4c06341c33c2ca1f86781dab0e829f88ad5b64be9fba56e56bc9ebdefc619e43

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: The models (official InsightFace release, checked)
        run: |
          set -euo pipefail
          mkdir -p w pack
          curl -fsSL --retry 4 -o w/buffalo_l.zip "$BUFFALO_URL"
          echo "$BUFFALO_SHA256  w/buffalo_l.zip" | sha256sum -c
          unzip -q -o w/buffalo_l.zip det_10g.onnx w600k_r50.onnx -d pack
          sha256sum -c <<EOF
          $DET_SHA256  pack/det_10g.onnx
          $REC_SHA256  pack/w600k_r50.onnx
          EOF
          curl -fsSL --retry 4 -o w/insightface-LICENSE.txt https://raw.githubusercontent.com/deepinsight/insightface/master/LICENSE || \
            echo "The InsightFace code is MIT licensed: https://github.com/deepinsight/insightface" > w/insightface-LICENSE.txt
          ls -la pack

      - name: ONNX Runtime with DirectML (official NuGet packages, checked against nuget.org)
        run: |
          set -euo pipefail
          mkdir -p nuget && cd nuget
          get() {
            local id="$1" ver="$2" lid
            lid=$(echo "$id" | tr 'A-Z' 'a-z')
            curl -fsSL --retry 4 -o "$lid.nupkg" "https://api.nuget.org/v3-flatcontainer/$lid/$ver/$lid.$ver.nupkg"
            local leaf entry want got
            leaf=$(curl -fsSL "https://api.nuget.org/v3/registration5-semver1/$lid/$ver.json")
            entry=$(echo "$leaf" | jq -r '.catalogEntry')
            want=$(curl -fsSL "$entry" | jq -r 'select(.packageHashAlgorithm == "SHA512") | .packageHash')
            got=$(openssl dgst -sha512 -binary "$lid.nupkg" | base64 -w0)
            [ -n "$want" ] && [ "$want" = "$got" ] || { echo "$id $ver: hash does not match nuget.org"; exit 1; }
            echo "$id $ver: SHA-512 matches nuget.org"
            mkdir -p "$lid" && (cd "$lid" && unzip -q ../"$lid.nupkg")
          }
          get Microsoft.ML.OnnxRuntime.DirectML "$ORT_DML_VERSION"
          get Microsoft.AI.DirectML "$DIRECTML_VERSION"
          cp microsoft.ml.onnxruntime.directml/runtimes/win-x64/native/onnxruntime.dll ../pack/
          cp microsoft.ai.directml/bin/x64-win/DirectML.dll ../pack/
          ls -la ../pack

      - name: Licences, readme, checksums
        run: |
          set -euo pipefail
          O=nuget/microsoft.ml.onnxruntime.directml
          D=nuget/microsoft.ai.directml
          lic() { find "$1" -maxdepth 1 -iname "$2" | head -1; }
          {
            echo "MEDIA VAULT — FACE RECOGNITION PACK: LICENCES"
            echo "============================================="
            echo
            echo "det_10g.onnx, w600k_r50.onnx  InsightFace buffalo_l: the SCRFD-10G face detector and the ArcFace"
            echo "    ResNet-50 recognition model (trained on WebFace600K), by the InsightFace project"
            echo "    (https://github.com/deepinsight/insightface), unchanged from $BUFFALO_URL"
            echo "    (SHA-256 $BUFFALO_SHA256)."
            echo "    The InsightFace code is MIT licensed, but its pretrained models, including these, are available"
            echo "    for NON-COMMERCIAL RESEARCH PURPOSES ONLY. Use this pack for PERSONAL, NON-COMMERCIAL purposes only."
            echo "onnxruntime.dll          ONNX Runtime $ORT_DML_VERSION with DirectML (Microsoft, MIT licence),"
            echo "    from the NuGet package Microsoft.ML.OnnxRuntime.DirectML $ORT_DML_VERSION."
            echo "DirectML.dll             DirectML $DIRECTML_VERSION (Microsoft), from the NuGet package"
            echo "    Microsoft.AI.DirectML $DIRECTML_VERSION; redistributed under its licence below."
            echo
            for f in w/insightface-LICENSE.txt "$(lic $O 'LICENSE*')" "$(lic $O 'ThirdPartyNotices*')" "$(lic $D 'LICENSE*')" "$(lic $D 'ThirdPartyNotices*')"; do
              [ -n "$f" ] && [ -f "$f" ] || continue
              echo; echo "==== $(basename "$f") ($(dirname "$f")) ===="; echo
              cat "$f"
            done
          } > pack/LICENSES.txt
          printf '%s\r\n' \
            "Media Vault face recognition pack" \
            "" \
            "Unzip into the same place as the app: this adds MediaVault\\tools\\faces." \
            "The app notices it by itself and scans your pictures again with the new model, once," \
            "in the background. Everything you said about who is who is kept." \
            "" \
            "InsightFace buffalo_l: finds small and turned faces and tells people apart much better." \
            "For personal, non-commercial use only (see LICENSES.txt)." \
            "" \
            "Everything runs offline, on the graphics card (DirectML) when it can, otherwise on the processor." \
            "Nothing decrypted is ever written to disk." > pack/README.txt
          tag="${{ github.event.inputs.tag }}"
          [ -n "$tag" ] || tag="faces-$(date -u +%Y-%m-%d)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          printf '%s\n' "$tag" "onnxruntime-directml $ORT_DML_VERSION" "directml $DIRECTML_VERSION" \
            "insightface buffalo_l (det_10g, w600k_r50)" > pack/VERSION.txt
          (cd pack && sha256sum *.onnx *.dll > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Zip and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p z/MediaVault/tools/faces
          cp pack/* z/MediaVault/tools/faces/
          (cd z && zip -qr -6 ../MediaVault-faces-windows.zip MediaVault)
          ls -la MediaVault-faces-windows.zip
          notes="Better face recognition (InsightFace buffalo_l, ONNX Runtime $ORT_DML_VERSION with DirectML). Unzip into the same place as the app; it adds MediaVault\\tools\\faces. For personal, non-commercial use only (see LICENSES.txt)."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" MediaVault-faces-windows.zip --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" MediaVault-faces-windows.zip --prerelease --title "Face recognition $TAG (download once)" --notes "$notes" -R "$GITHUB_REPOSITORY"
          fi
