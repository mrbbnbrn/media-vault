[workspace]
resolver = "3"
members = ["crates/vault-core", "crates/vault-export", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1

# Keep password hashing and encryption fast in debug builds too.
[profile.dev.package."*"]
opt-level = 3
