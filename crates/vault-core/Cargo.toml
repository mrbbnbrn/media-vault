[package]
name = "vault-core"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
bip39 = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = "1.9.1"

[dev-dependencies]
rusqlite = "0.40.2"
tempfile = "3.27.0"
